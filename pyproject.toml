[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shensi-Robot"
version = "0.1.0"
description = "Offline kinematics for the Juxie dual-arm robot SDK"
readme = "README.md"
requires-python = ">=3.10"
# NOTE: no vendor data is packaged here on purpose. The kinematics library reads the
# vendor's YAML configuration from an extracted SDK at runtime; see shensi_robot.config.
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
shensi-kin = "shensi_robot.cli:kin_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shensi_robot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default test run must stay offline: it never opens a socket and never touches a robot.
# Integration tests that talk to the vendor binary are marked and skipped unless asked for.
markers = [
    "hardware: needs a real robot (never runs in default CI)",
    "vendor_binary: needs an extracted SDK and qemu",
]
addopts = "-m 'not hardware and not vendor_binary'"
